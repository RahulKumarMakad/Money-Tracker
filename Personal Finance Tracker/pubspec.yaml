name: penny_pilot
description: >
  PennyPilot — Personal Finance & Spending Insights.
  Offline-first expense tracking, budgeting, and spending analytics
  for students and young professionals.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Local Database
  sqflite: ^2.3.3
  path: ^1.9.0

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.3.1
  path_provider: ^2.1.4

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0

  # Export & Sharing
  csv: ^6.0.0
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - images/
